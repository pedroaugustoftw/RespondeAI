name: Pacotes de download
on:
  workflow_dispatch:
    inputs:
      windows_arm_only:
        description: Gerar somente Windows ARM64
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.label }}-${{ matrix.arch }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.windows_arm_only && '[{"os":"windows-11-arm","label":"Windows","arch":"arm64"}]' || '[{"os":"windows-latest","label":"Windows","arch":"x64"},{"os":"windows-11-arm","label":"Windows","arch":"arm64"},{"os":"ubuntu-24.04","label":"Linux","arch":"x64"},{"os":"ubuntu-24.04-arm","label":"Linux","arch":"arm64"},{"os":"macos-15-intel","label":"macOS","arch":"x64"},{"os":"macos-15","label":"macOS","arch":"arm64"}]') }}
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - name: Bibliotecas Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 libdbus-1-3
      - name: Compilador ARM64
        if: matrix.os == 'windows-11-arm'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Dependencias nativas Windows ARM64
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: .github/scripts/windows_arm64.ps1
      - name: Dependencias Python
        run: python -m pip install -r requirements.txt pyinstaller pillow
      - name: Compilar e verificar pacote
        run: python .github/scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: RespondeAI-${{ matrix.label }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
      - name: Relatorio de diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-${{ matrix.label }}-${{ matrix.arch }}
          path: build/diagnostic.json
          if-no-files-found: ignore
